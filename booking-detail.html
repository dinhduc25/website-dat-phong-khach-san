<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết đặt phòng | Lotte Hotel Hanoi</title>
<style>
:root{--navy:#142b49;--blue:#087bc1;--muted:#64748b;--line:#e2e8f0;--bg:#f3f6fb;--green:#07845b;--orange:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172b45;font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.55}
a{color:inherit;text-decoration:none}.page{max-width:1120px;margin:32px auto 54px;padding:0 20px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.back{display:inline-flex;align-items:center;gap:8px;color:#087bc1;font-weight:750}.brand{font-weight:850;letter-spacing:.2px;color:#15365a}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:850;color:#0b84c6;text-transform:uppercase}.page-title{font-size:30px;line-height:1.2;margin:5px 0 6px;color:#112744}.lead{margin:0;color:var(--muted)}.summary{margin-top:24px;border:1px solid #dbe6f2;border-radius:20px;padding:24px;background:linear-gradient(120deg,#fff 0%,#f0f8ff 100%);box-shadow:0 10px 30px rgba(20,43,73,.06)}.summary-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.booking-code{display:inline-flex;gap:8px;align-items:center;background:#e8f4ff;color:#075985;border-radius:8px;padding:6px 10px;font-weight:850;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.status-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#fff7ed;color:#9a3412;font-weight:800;font-size:12px;border:1px solid #fed7aa;white-space:normal}.status-pill.is-good{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.status-pill.is-muted{background:#f1f5f9;color:#475569;border-color:#cbd5e1}.hotel-title{font-size:22px;font-weight:850;margin:14px 0 2px}.hotel-subtitle{color:var(--muted)}.summary-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}.kpi{background:#fff;border:1px solid #e1eaf4;border-radius:12px;padding:13px 14px;min-width:0}.kpi-label{display:block;color:#718096;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.45px}.kpi-value{display:block;margin-top:5px;font-weight:850;font-size:15px;overflow-wrap:anywhere;color:#143354}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #e0e8f1;border-radius:17px;padding:22px;box-shadow:0 5px 20px rgba(20,43,73,.035);min-width:0}.card h2{font-size:17px;margin:0 0 16px;color:#173452}.section-hint{font-size:12px;color:var(--muted);margin:-9px 0 17px}.stay-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stay-date{border:1px solid #dce8f4;background:#f8fbff;border-radius:13px;padding:15px}.date-label{font-size:11px;color:#718096;font-weight:850;letter-spacing:.5px;text-transform:uppercase}.date-value{font-size:19px;font-weight:850;color:#163858;margin-top:5px}.date-small{font-size:12px;color:var(--muted);margin-top:2px}.info-list{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}.info-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eef2f7;padding:11px 0;min-width:0}.info-row span{color:var(--muted);flex-shrink:0}.info-row strong{text-align:right;overflow-wrap:anywhere;color:#1f344e}.room-banner{margin-top:18px;padding:15px;border-radius:12px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af}.room-banner.assigned{border-color:#a7f3d0;background:#ecfdf5;color:#065f46}.room-banner strong{display:block;margin-bottom:3px}.money-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #edf2f7}.money-row:last-child{border-bottom:0}.money-row span{color:var(--muted)}.money-row strong{text-align:right}.money-row.total{align-items:center;border-top:1px dashed #cbd5e1;border-bottom:0;margin-top:7px;padding-top:17px}.money-row.total span{font-weight:850;color:#173452}.money-row.total strong{font-size:23px;font-weight:900;color:#e85d16}.payment-plan{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:12px;margin-top:14px}.payment-plan strong{display:block;color:#143654}.payment-plan p{margin:4px 0 0;color:#65768d;font-size:12px}.notice{border-radius:12px;border:1px solid #bfdbfe;background:#eff6ff;padding:14px;margin-top:16px;color:#21476c;line-height:1.6}.notice strong{display:block;margin-bottom:3px;color:#133e66}.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;position:relative;padding-bottom:19px}.timeline-item:last-child{padding-bottom:0}.timeline-line{position:relative;display:flex;justify-content:center}.timeline-line:after{content:"";position:absolute;top:23px;bottom:-1px;width:2px;background:#e2e8f0}.timeline-item:last-child .timeline-line:after{display:none}.timeline-dot{position:relative;z-index:1;width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border:1px solid #cbd5e1;color:#64748b;font-size:11px;font-weight:900}.timeline-item.done .timeline-dot{background:#dcfce7;color:#047857;border-color:#86efac}.timeline-item.current .timeline-dot{background:#dbeafe;color:#075985;border:2px solid #60a5fa}.timeline-title{font-weight:800;color:#203b59}.timeline-desc{margin-top:2px;color:#718096;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 15px;border-radius:10px;border:1px solid #cbd9e8;background:#fff;color:#24425f;font-weight:850;font-size:13px;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#0788cc,#0066ac);border-color:#087bc1;color:#fff;box-shadow:0 5px 12px rgba(7,123,193,.16)}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.empty{background:#fff;border:1px solid #e2e8f0;padding:30px;border-radius:16px;text-align:center;color:var(--muted);margin-top:24px}.footer-note{text-align:center;color:#94a3b8;font-size:11px;margin-top:25px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.summary-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.page{margin-top:20px}.summary{padding:19px}.card{padding:18px}}
@media(max-width:520px){.page{padding:0 12px}.topline{align-items:flex-start;flex-direction:column}.page-title{font-size:25px}.summary-head{flex-direction:column}.summary-kpis{gap:8px}.kpi{padding:11px}.kpi-value{font-size:13px}.info-list{grid-template-columns:1fr}.stay-grid{gap:8px}.date-value{font-size:16px}.card{padding:15px}}
</style>
</head>
<body>
<main class="page">
  <div class="topline"><a class="back" href="index.html?showBookings=1">← Quay lại Đặt chỗ của tôi</a><span class="brand">LOTTE HOTEL HANOI</span></div>
  <div class="eyebrow">Khu vực khách hàng</div><h1 class="page-title">Chi tiết đặt phòng</h1><p class="lead">Theo dõi tình trạng xác nhận, thanh toán và thông tin lưu trú của bạn.</p>
  <div id="detail-root"><div class="empty">Đang tải chi tiết đặt phòng…</div></div>
  <div class="footer-note">LOTTE HOTEL HANOI · Thông tin hiển thị theo trạng thái đặt phòng hiện tại.</div>
</main>
<script>
(function(){
 const money=n=>Number(n||0).toLocaleString('vi-VN')+'₫';
 const safeParse=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(e){return fallback}};
 const esc=value=>String(value??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const dateText=value=>{if(!value)return '—';const d=new Date(value+'T00:00:00');return isNaN(d)?esc(value):d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})};
 const dateTimeText=value=>{if(!value)return '—';const d=new Date(value);return isNaN(d)?esc(value):d.toLocaleString('vi-VN')};
 const statusClass=status=>['Đã thanh toán - chờ nhận phòng','Đã cọc 30% - chờ nhận phòng','Đang lưu trú','Hoàn thành','Đã xác nhận'].includes(status)?'is-good':status==='Đã hủy'?'is-muted':'';
 function paymentLabel(b){if(b.paymentSubmittedType==='deposit_30_percent'||b.paymentPlan==='deposit_30_cash_at_hotel')return 'Cọc 30% online · 70% tiền mặt tại quầy';if(b.paymentSubmittedType==='full_payment'||b.paymentPlan==='full_online_qr')return 'Thanh toán 100% online bằng QR';const m=String(b.paymentMethod||'');if(m.includes('Cọc 30%'))return 'Cọc 30% online · 70% tiền mặt tại quầy';if(m.includes('100% online'))return 'Thanh toán 100% online bằng QR';return 'Chọn sau khi khách sạn xác nhận còn phòng';}
 function rawAmount(b){const raw=Number(b.rawAmount);if(Number.isFinite(raw)&&raw>0)return raw;const parsed=Number(String(b.totalPrice||'').replace(/[^\d]/g,''));return Number.isFinite(parsed)?parsed:0;}
 function timeline(b){
  const s=b.status||'';const cancelled=s==='Đã hủy';
  const firstDone=!!b.bookedAt;
  const availableDone=!!b.availabilityConfirmedAt||['Chờ thanh toán','Đã cọc 30% - chờ nhận phòng','Đã thanh toán - chờ nhận phòng','Đang lưu trú','Hoàn thành'].includes(s);
  const paymentDone=!!b.paymentConfirmedAt||!!b.paidAt||['Đã cọc 30% - chờ nhận phòng','Đã thanh toán - chờ nhận phòng','Đã xác nhận','Đang lưu trú','Hoàn thành'].includes(s);
  const roomDone=!!b.roomNumber;
  const stayDone=['Đang lưu trú','Hoàn thành'].includes(s);
  const steps=[
   {title:'Đã gửi yêu cầu đặt phòng',desc:'Khách sạn đã nhận thông tin yêu cầu của bạn.',done:firstDone},
   {title:'Khách sạn xác nhận còn phòng',desc:availableDone?'Yêu cầu đã được kiểm tra và xác nhận còn phòng.':'Đang chờ admin kiểm tra hạng phòng và ngày lưu trú.',done:availableDone},
   {title:'Xác nhận thanh toán',desc:b.paymentSubmittedAt&&!paymentDone?'Bạn đã gửi thông tin chuyển khoản; đang chờ admin đối chiếu.':paymentDone?'Khoản thanh toán đã được admin xác nhận.':(availableDone?'Thanh toán trong vòng 24 giờ sau khi khách sạn xác nhận còn phòng.':'Bước thanh toán mở sau khi xác nhận còn phòng.'),done:paymentDone,current:availableDone&&!paymentDone},
   {title:'Gán số phòng',desc:roomDone?'Phòng '+b.roomNumber+(b.floor?' · Tầng '+b.floor:'')+' đã được gán cho đơn đặt phòng.':'Số phòng sẽ được xếp sau khi admin xác nhận khoản thanh toán.',done:roomDone,current:paymentDone&&!roomDone},
   {title:'Nhận phòng tại khách sạn',desc:stayDone?'Trạng thái lưu trú đã được cập nhật.':'Đến quầy lễ tân theo ngày nhận phòng để làm thủ tục.',done:stayDone}
  ];
  if(cancelled)return '<div class="notice"><strong>Đơn đặt phòng đã hủy</strong>Trạng thái của đơn là Đã hủy. Nếu bạn cần đặt lại, vui lòng quay về trang chủ để gửi yêu cầu mới.</div>';
  return '<div class="timeline">'+steps.map((st,i)=>'<div class="timeline-item '+(st.done?'done ':'')+(st.current?'current':'')+'"><div class="timeline-line"><div class="timeline-dot">'+(st.done?'✓':i+1)+'</div></div><div><div class="timeline-title">'+esc(st.title)+'</div><div class="timeline-desc">'+esc(st.desc)+'</div></div></div>').join('')+'</div>';
 }
 function getBooking(){
  const id=new URLSearchParams(location.search).get('bookingId');if(!id)return null;
  const current=safeParse('traveloka_current_user',null);let customerBooking=null;
  if(current&&Array.isArray(current.bookings))customerBooking=current.bookings.find(b=>b.bookingId===id)||null;
  if(!customerBooking){const users=safeParse('traveloka_hotel_users',[]);const user=Array.isArray(users)?users.find(u=>(u.id&&current&&u.id===current.id)||(u.email&&current&&u.email===current.email)):null;customerBooking=user&&Array.isArray(user.bookings)?user.bookings.find(b=>b.bookingId===id)||null:null;}
  if(!customerBooking)return null;
  const all=safeParse('traveloka_all_bookings',[]);const adminBooking=Array.isArray(all)?all.find(b=>b.bookingId===id):null;
  return Object.assign({},customerBooking,adminBooking||{});
 }
 function render(){
  const root=document.getElementById('detail-root'),b=getBooking();if(!b){root.innerHTML='<div class="empty"><h2 style="margin:0 0 8px;color:#173452">Không tìm thấy đặt phòng</h2><p>Vui lòng đăng nhập đúng tài khoản đã tạo đơn hoặc mở chi tiết từ mục “Đặt chỗ của tôi”.</p><div class="actions" style="justify-content:center"><a class="btn btn-primary" href="index.html?showBookings=1">Quay lại Đặt chỗ của tôi</a></div></div>';return;}
  const total=rawAmount(b),deposit=Number(b.depositAmount||((b.paymentSubmittedType==='deposit_30_percent'||b.paymentPlan==='deposit_30_cash_at_hotel')?Math.round(total*.3):0));
  const remaining=Number(b.remainingAmount||((b.paymentSubmittedType==='deposit_30_percent'||b.paymentPlan==='deposit_30_cash_at_hotel')?Math.max(0,total-deposit):0));
  const paidFull=!!b.paymentConfirmedAt&&b.paymentSubmittedType==='full_payment'||b.paymentStatus==='Đã thanh toán đầy đủ';
  const paidNow=paidFull?total:(b.paymentConfirmedAt||b.paidAt?deposit:0);
  const status=b.status||'Chưa xác định';const roomAssigned=!!b.roomNumber;
  const canPay=status==='Chờ thanh toán'&&!b.paymentSubmittedAt;
  const paymentText=b.paymentSubmittedAt&&!b.paymentConfirmedAt?(b.paymentSubmittedType==='deposit_30_percent'?'Đang chờ xác nhận cọc 30%':'Đang chờ xác nhận thanh toán'):(b.paymentStatus||'Chưa thanh toán');
  const stayDuration=Number(b.nights||0)||Math.max(1,Math.round((new Date(b.checkout)-new Date(b.checkin))/86400000)||1);
  root.innerHTML=`
   <section class="summary">
    <div class="summary-head"><div><span class="booking-code">▤ ${esc(b.bookingId)}</span><h2 class="hotel-title">${esc(b.hotelName||'Lotte Hotel Hanoi')}</h2><div class="hotel-subtitle">${esc(b.roomType||'Hạng phòng theo yêu cầu')} · ${esc(b.guests||'Thông tin khách theo yêu cầu')}</div></div><span class="status-pill ${statusClass(status)}"><span aria-hidden="true">●</span>${esc(status)}</span></div>
    <div class="summary-kpis"><div class="kpi"><span class="kpi-label">Ngày đặt</span><strong class="kpi-value">${esc(dateText((b.bookedAt||'').slice(0,10)))}</strong></div><div class="kpi"><span class="kpi-label">Thời lượng</span><strong class="kpi-value">${stayDuration} đêm</strong></div><div class="kpi"><span class="kpi-label">Số phòng</span><strong class="kpi-value">${esc(b.rooms||1)} phòng</strong></div><div class="kpi"><span class="kpi-label">Tổng tiền</span><strong class="kpi-value">${esc(money(total))}</strong></div></div>
   </section>
   <div class="layout">
    <div>
     <section class="card"><h2>Thông tin lưu trú</h2><p class="section-hint">Kiểm tra ngày ở và thông tin hạng phòng đã đăng ký.</p>
      <div class="stay-grid"><div class="stay-date"><div class="date-label">Nhận phòng</div><div class="date-value">${esc(dateText(b.checkin))}</div><div class="date-small">Theo giờ nhận phòng của khách sạn</div></div><div class="stay-date"><div class="date-label">Trả phòng</div><div class="date-value">${esc(dateText(b.checkout))}</div><div class="date-small">${stayDuration} đêm lưu trú</div></div></div>
      <div class="info-list"><div class="info-row"><span>Hạng phòng</span><strong>${esc(b.roomType||'—')}</strong></div><div class="info-row"><span>Số phòng yêu cầu</span><strong>${esc(b.rooms||1)}</strong></div><div class="info-row"><span>Số khách</span><strong>${esc(b.guests||'—')}</strong></div><div class="info-row"><span>Yêu cầu đặc biệt</span><strong>${esc(b.note||'Không có')}</strong></div></div>
      <div class="room-banner ${roomAssigned?'assigned':''}"><strong>${roomAssigned?'✓ Đã gán phòng':'⌛ Chưa gán số phòng'}</strong>${roomAssigned?'Phòng '+esc(b.roomNumber)+(b.floor?' · Tầng '+esc(b.floor):'')+'.':(paidNow>0?'Khách sạn sẽ hoàn tất phân phòng sau khi admin kiểm tra trạng thái thanh toán.':'Số phòng cụ thể sẽ được gán sau khi admin xác nhận đã nhận khoản thanh toán.')}</div>
     </section>
     <section class="card" style="margin-top:18px"><h2>Thông tin khách hàng</h2><div class="info-list" style="margin-top:0"><div class="info-row"><span>Họ tên</span><strong>${esc(b.customerName||b.guestName||'—')}</strong></div><div class="info-row"><span>Email</span><strong>${esc(b.customerEmail||'—')}</strong></div><div class="info-row"><span>Điện thoại</span><strong>${esc(b.customerPhone||'—')}</strong></div><div class="info-row"><span>Mã đặt phòng</span><strong>${esc(b.bookingId)}</strong></div></div></section>
     <section class="card" style="margin-top:18px"><h2>Tiến trình xử lý</h2><p class="section-hint">Các bước sẽ tự cập nhật khi khách sạn xử lý đơn đặt phòng.</p>${timeline(b)}</section>
    </div>
    <aside>
     <section class="card"><h2>Chi phí & thanh toán</h2><div class="money-row"><span>Tổng tiền phòng</span><strong>${esc(money(total))}</strong></div><div class="money-row"><span>Phương thức</span><strong>${esc(paymentLabel(b))}</strong></div><div class="money-row"><span>Trạng thái thanh toán</span><strong>${esc(paymentText)}</strong></div>${deposit>0?'<div class="money-row"><span>Tiền cọc 30%</span><strong>'+esc(money(deposit))+'</strong></div><div class="money-row"><span>Còn lại tại quầy</span><strong>'+esc(money(remaining))+'</strong></div>':''}<div class="money-row total"><span>Tổng giá trị đơn</span><strong>${esc(money(total))}</strong></div>
      <div class="payment-plan"><strong>${canPay?'Bạn có thể thanh toán online':b.paymentSubmittedAt&&!b.paymentConfirmedAt?'Yêu cầu thanh toán đã được gửi':paymentDoneLabel(b)}</strong><p>${canPay?'Sau khi admin xác nhận còn phòng, chọn thanh toán 100% online hoặc cọc 30% online tại trang thanh toán. Hạn xử lý là 24 giờ.':b.paymentSubmittedAt&&!b.paymentConfirmedAt?'Đơn đang chờ admin đối chiếu giao dịch thực tế. Chưa ghi nhận đã thanh toán.':(b.customerNotice&&b.customerNotice.message)||'Thông tin trạng thái được cập nhật theo tiến trình xử lý đặt phòng.'}</p></div>
      ${b.customerNotice?'<div class="notice"><strong>'+esc(b.customerNotice.title||'Thông báo từ khách sạn')+'</strong>'+esc(b.customerNotice.message||'')+'</div>':''}
      <div class="actions">${canPay?'<a class="btn btn-primary" href="payment.html?bookingId='+encodeURIComponent(b.bookingId)+'">Thanh toán bằng QR →</a>':''}<a class="btn" href="index.html?showBookings=1">Đặt chỗ của tôi</a></div>
     </section>
    </aside>
   </div>`;
 }
 function paymentDoneLabel(b){if(b.status==='Đã cọc 30% - chờ nhận phòng')return 'Đã xác nhận cọc 30%';if(b.status==='Đã thanh toán - chờ nhận phòng'||b.status==='Đã xác nhận'||b.status==='Đang lưu trú'||b.status==='Hoàn thành')return 'Thanh toán đã xác nhận';if(b.status==='Đã hủy')return 'Đơn đã hủy';return 'Đang chờ xác nhận';}
 render();
 window.addEventListener('storage',e=>{if(['traveloka_hotel_users','traveloka_all_bookings','traveloka_current_user'].includes(e.key))render();});
})();
</script>
</body>
</html>
